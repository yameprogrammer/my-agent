# 프로덕션용 Compose — 기본 비밀번호를 코드에 두지 않습니다.
# 필수 환경변수(.env 또는 셸): POSTGRES_PASSWORD, JWT_SECRET, INITIAL_ADMIN_PASSWORD, API_KEY_ENCRYPTION_SECRET
version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: novel-agent-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 기본값 없음 — 미설정 시 compose 가 실패하도록 함
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong secret}
      POSTGRES_DB: ${POSTGRES_DB:-novel_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # 프로덕션에서는 DB 포트를 호스트에 노출하지 않는 것을 권장 (앱 네트워크만 사용)
    # ports:
    #   - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-novel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novel-agent-app-prod
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-novel_db}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - API_KEY_ENCRYPTION_SECRET=${API_KEY_ENCRYPTION_SECRET:?Set API_KEY_ENCRYPTION_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_CHAT_ID=${ADMIN_TELEGRAM_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - BASE_URL=${BASE_URL}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@example.com}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata_prod:
    driver: local
